name: LeoCAD CI

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Qt
      uses: jurplel/install-qt-action@v4  
      with:
        version: '5.15.*'
        cache: 'true'
    - name: Install software OpenGL and virtual display
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-utils
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Generate Makefile
      run: qmake PREFIX=/usr
    - name: Build
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Generate test Makefile
      run: |
        mkdir -p build/tests
        cd build/tests
        qmake ../../tests/tests.pro CONFIG+=release CONFIG-=debug
    - name: Build tests
      working-directory: build/tests
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run tests
      working-directory: build/tests
      run: make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Generate integration test Makefile
      run: |
        mkdir -p build/model-instance-tests
        cd build/model-instance-tests
        qmake ../../tests/model_instances.pro CONFIG+=release CONFIG-=debug
    - name: Build integration tests
      working-directory: build/model-instance-tests
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run integration tests with OpenGL
      working-directory: build/model-instance-tests
      env:
        QT_QPA_PLATFORM: xcb
        LIBGL_ALWAYS_SOFTWARE: 'true'
        LEOCAD_TEST_NATIVE_INTERFACE: '1'
      run: |
        xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B
        xvfb-run -a -s "-screen 0 1280x1024x24" make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ runner.os }}
        path: |
          build/tests/test-results.xml
          build/model-instance-tests/**/test-results.xml
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        cache: 'true'
    - name: Cache Library
      uses: actions/cache@v6
      id: cache-library
      with:
        path: library.bin
        key: library-26.08
    - name: Download Library
      if: steps.cache-library.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/leozide/leocad/releases/download/v26.09/Library-26.08.zip -O library.zip
        unzip library.zip
    - name: Cache POV-Ray
      uses: actions/cache@v6
      id: cache-povray
      with:
        path: povray
        key: povray-build1
    - name: Download POV-Ray
      if: steps.cache-povray.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/leozide/povray/releases/download/build1/povray
        chmod +x povray
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/leozide/leocad/commits/master | jq -r '.sha' > remote.txt
        REMOTE=$(cat remote.txt)
        echo "REMOTE=$REMOTE"        
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Generate Makefile
      run: qmake -early QMAKE_DEFAULT_LIBDIRS=$(xcrun -show-sdk-path)/usr/lib PREFIX=/usr
    - name: Build
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Generate test Makefile
      run: |
        mkdir -p build/tests
        cd build/tests
        qmake ../../tests/tests.pro CONFIG+=release CONFIG-=debug
    - name: Build tests
      working-directory: build/tests
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run tests
      working-directory: build/tests
      run: make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Generate integration test Makefile
      run: |
        mkdir -p build/model-instance-tests
        cd build/model-instance-tests
        qmake -early QMAKE_DEFAULT_LIBDIRS=$(xcrun -show-sdk-path)/usr/lib ../../tests/model_instances.pro CONFIG+=release CONFIG-=debug
    - name: Build integration tests
      working-directory: build/model-instance-tests
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run integration tests
      working-directory: build/model-instance-tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ runner.os }}
        path: |
          build/tests/test-results.xml
          build/model-instance-tests/**/test-results.xml
        if-no-files-found: ignore

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v7
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        # aqtinstall 3.3 cannot read Qt 6.11's Windows repository layout.
        version: '6.10.3'
        arch: 'win64_msvc2022_64'
        cache: 'true'
    - name: Generate Makefile
      run: qmake -spec win32-msvc CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build
      run: nmake /NOLOGO
    - name: Generate test Makefile
      run: |
        mkdir build\tests
        cd build\tests
        qmake ..\..\tests\tests.pro -spec win32-msvc CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build tests
      working-directory: build/tests
      run: nmake /NOLOGO
    - name: Run tests
      working-directory: build/tests
      run: nmake /NOLOGO check "TESTARGS=-o test-results.xml,junitxml -o -,txt"
    - name: Generate integration test Makefile
      run: |
        mkdir build\model-instance-tests
        cd build\model-instance-tests
        qmake ..\..\tests\model_instances.pro -spec win32-msvc CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build integration tests
      working-directory: build/model-instance-tests
      run: nmake /NOLOGO
    - name: Run integration tests
      working-directory: build/model-instance-tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: nmake /NOLOGO check "TESTARGS=-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ runner.os }}
        path: |
          build/tests/test-results.xml
          build/model-instance-tests/**/test-results.xml
        if-no-files-found: ignore
